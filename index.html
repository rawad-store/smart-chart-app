<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الشارت الذكي – محاكاة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Outfit', system-ui, sans-serif; }
        body { margin:0; background:#0f172a; color:white; }
        .glass {
            background: rgba(15,23,42,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100,200,255,0.2);
            border-radius: 16px;
        }
        .upload-area {
            border: 2px dashed rgba(100,200,255,0.4);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
        }
        .upload-area:hover { background: rgba(30,41,59,0.4); }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: bold;
        }
        .decision-box {
            background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.8));
            border: 2px solid rgba(100,200,255,0.3);
            border-radius: 20px;
            padding: 2rem;
        }
        .disclaimer { color: #fca5a5; font-size: 0.875rem; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>

    <div id="root">جاري تحميل التطبيق...</div>

    <script type="text/babel">
        // ────────────────────────────────────────────────
        // أيقونات بسيطة (بدون Fi* من lucide، نعتمد على svg مباشرة)
        // ────────────────────────────────────────────────
        const IconUpload = () => React.createElement('svg', {width:32,height:32,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},
            React.createElement('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),
            React.createElement('polyline',{points:'17 8 12 3 7 8'}),
            React.createElement('line',{x1:12,y1:3,x2:12,y2:15}));

        const IconZap = () => React.createElement('svg',{width:32,height:32,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},
            React.createElement('polygon',{points:'13 2 3 14 12 14 11 22 21 10 12 10 13 2'}));

        const IconUp = () => React.createElement('svg',{width:48,height:48,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},
            React.createElement('polyline',{points:'23 6 13.5 15.5 8 10 1 18'}));

        const IconDown = () => React.createElement('svg',{width:48,height:48,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},
            React.createElement('polyline',{points:'23 18 13.5 8.5 8 14 1 7'}));

        const IconLoader = () => React.createElement('svg',{width:24,height:24,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,className:'animate-spin'},
            React.createElement('line',{x1:12,y1:2,x2:12,y2:6}),
            React.createElement('line',{x1:12,y1:18,x2:12,y2:22}),
            React.createElement('line',{x1:4.93,y1:4.93,x2:7.76,y2:7.76}),
            React.createElement('line',{x1:16.24,y1:16.24,x2:19.07,y2:19.07}));

        // ────────────────────────────────────────────────
        // المكون الرئيسي
        // ────────────────────────────────────────────────
        const SmartChartAnalyzer = () => {
            const [preview, setPreview] = React.useState(null);
            const [analysis, setAnalysis] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const [assetName, setAssetName] = React.useState('');
            const [currentPrice, setCurrentPrice] = React.useState('');
            const fileRef = React.useRef(null);

            const handleFile = e => {
                const file = e.target.files[0];
                if (!file || !file.type.startsWith('image/')) return alert('اختر صورة فقط');
                if (file.size > 5*1024*1024) return alert('الحد الأقصى 5 ميجا');

                const reader = new FileReader();
                reader.onload = ev => setPreview(ev.target.result);
                reader.readAsDataURL(file);
            };

            const analyze = async () => {
                if (!preview || !assetName || !currentPrice) return alert('املأ جميع الحقول');
                setLoading(true);

                await new Promise(r => setTimeout(r, 1800));

                const price = parseFloat(currentPrice) || 100;
                const score = Math.floor(Math.random() * 21) - 10; // -10 → +10

                let decision = 'محايد', color = 'yellow', trend = 'تذبذب';
                if (score >= 5)  { decision = 'شراء قوي'; color = 'green'; trend = 'صاعد قوي'; }
                else if (score >= 1) { decision = 'شراء'; color = 'emerald'; trend = 'صاعد'; }
                else if (score <= -5) { decision = 'بيع قوي'; color = 'red'; trend = 'هابط قوي'; }
                else if (score <= -1) { decision = 'بيع'; color = 'rose'; trend = 'هابط'; }

                setAnalysis({
                    decision, trend, color,
                    confidence: Math.floor(55 + Math.random()*35),
                    support: [(price*0.94).toFixed(2), (price*0.90).toFixed(2)],
                    resistance: [(price*1.06).toFixed(2), (price*1.11).toFixed(2)],
                    entry: (price * (score >= 0 ? 0.98 : 1.02)).toFixed(2),
                    tp: (price * (score >= 0 ? 1.12 : 0.88)).toFixed(2),
                    sl: (price * (score >= 0 ? 0.94 : 1.06)).toFixed(2),
                });
                setLoading(false);
            };

            const reset = () => {
                setPreview(null); setAnalysis(null);
                setAssetName(''); setCurrentPrice('');
                if (fileRef.current) fileRef.current.value = '';
            };

            const colors = {
                green:   {text:'text-emerald-400', bg:'from-emerald-950'},
                emerald: {text:'text-emerald-300', bg:'from-emerald-950'},
                red:     {text:'text-rose-400',    bg:'from-rose-950'},
                rose:    {text:'text-rose-300',    bg:'from-rose-950'},
                yellow:  {text:'text-amber-400',   bg:'from-amber-950'},
            };

            const c = analysis ? colors[analysis.color] : colors.yellow;

            return React.createElement('div', {className:'min-h-screen p-6 bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900'},
                React.createElement('div', {className:'max-w-4xl mx-auto'},
                    React.createElement('h1', {className:'text-4xl font-bold text-center mb-2 bg-gradient-to-r from-cyan-300 to-blue-400 bg-clip-text text-transparent'},
                        'محلل الشارت الذكي'
                    ),
                    React.createElement('p', {className:'text-center text-slate-400 mb-10'}, 'محاكاة تعليمية فقط – ليس توصية استثمارية'),

                    !analysis ?
                    React.createElement('div', {className:'glass p-8'},
                        React.createElement('div', {className:'grid md:grid-cols-2 gap-6 mb-8'},
                            React.createElement('div', null,
                                React.createElement('label', {className:'block text-sm mb-2'}, 'اسم الأصل'),
                                React.createElement('input', {
                                    type:'text', value:assetName, onChange:e=>setAssetName(e.target.value),
                                    placeholder:'مثال: BTCUSDT', className:'w-full p-3 bg-slate-800 border border-slate-600 rounded-lg'
                                })
                            ),
                            React.createElement('div', null,
                                React.createElement('label', {className:'block text-sm mb-2'}, 'السعر الحالي'),
                                React.createElement('input', {
                                    type:'number', value:currentPrice, onChange:e=>setCurrentPrice(e.target.value),
                                    placeholder:'0.00', className:'w-full p-3 bg-slate-800 border border-slate-600 rounded-lg'
                                })
                            )
                        ),

                        React.createElement('div', {className:'mb-8'},
                            React.createElement('label', {className:'block text-sm mb-2'}, 'صورة الشارت'),
                            React.createElement('div', {className:'upload-area', onClick:()=>fileRef.current.click()},
                                React.createElement('input', {ref:fileRef, type:'file', accept:'image/*', onChange:handleFile, hidden:true}),
                                React.createElement('div', {className:'text-6xl text-blue-400 mb-4'}, React.createElement(IconUpload)),
                                React.createElement('p', null, 'اضغط أو اسحب الصورة هنا')
                            )
                        ),

                        preview && React.createElement('img', {src:preview, className:'max-h-64 mx-auto rounded-xl mb-8 border border-slate-600', alt:'preview'}),

                        React.createElement('div', {className:'flex gap-4'},
                            React.createElement('button', {
                                onClick:analyze, disabled:loading || !preview || !assetName || !currentPrice,
                                className:'btn-primary flex-1 flex items-center justify-center gap-2 disabled:opacity-50'
                            },
                                loading ? React.createElement(React.Fragment, null,
                                    React.createElement(IconLoader, {className:'animate-spin'}), 'جاري التحليل...'
                                ) : React.createElement(React.Fragment, null,
                                    React.createElement(IconZap), 'حلل الآن'
                                )
                            ),
                            React.createElement('button', {onClick:reset, className:'px-6 py-3 bg-slate-700 rounded-lg hover:bg-slate-600'}, 'إعادة تعيين')
                        ),

                        React.createElement('p', {className:'disclaimer mt-6'}, 'هذه نتائج محاكاة عشوائية لأغراض توضيحية فقط')
                    )
                    :
                    React.createElement('div', {className:'space-y-8'},
                        preview && React.createElement('img', {src:preview, className:'max-h-96 mx-auto rounded-2xl border border-blue-800/40', alt:'chart'}),
                        React.createElement('div', {className:`decision-box bg-gradient-to-br ${c.bg} to-slate-950 text-center p-10`},
                            React.createElement('h2', {className:`text-5xl font-black mb-4 ${c.text}`}, analysis.decision),
                            React.createElement('p', {className:'text-2xl mb-6'}, 'الاتجاه: ', React.createElement('strong', null, analysis.trend)),
                            React.createElement('p', {className:'text-3xl mb-8'}, 'ثقة: ', analysis.confidence, '%'),

                            React.createElement('div', {className:'grid md:grid-cols-3 gap-6 mb-8'},
                                React.createElement('div', {className:'bg-black/30 p-4 rounded-xl'},
                                    React.createElement('p', {className:'text-slate-400'}, 'دخول مقترح'),
                                    React.createElement('p', {className:'text-2xl font-bold text-cyan-300'}, analysis.entry)
                                ),
                                React.createElement('div', {className:'bg-black/30 p-4 rounded-xl'},
                                    React.createElement('p', {className:'text-slate-400'}, 'جني أرباح'),
                                    React.createElement('p', {className:'text-2xl font-bold text-emerald-400'}, analysis.tp)
                                ),
                                React.createElement('div', {className:'bg-black/30 p-4 rounded-xl'},
                                    React.createElement('p', {className:'text-slate-400'}, 'وقف خسارة'),
                                    React.createElement('p', {className:'text-2xl font-bold text-rose-400'}, analysis.sl)
                                )
                            ),

                            React.createElement('button', {onClick:reset, className:'btn-primary px-10 py-4 text-lg'}, 'تحليل جديد')
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(SmartChartAnalyzer));
    </script>
</body>
</html>
