<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الشارت الذكي - AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap');
        
        * { 
            font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 12px 48px 0 rgba(59, 130, 246, 0.2);
            transform: translateY(-4px);
        }

        .upload-zone {
            border: 3px dashed rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.4) 0%, rgba(30, 41, 59, 0.3) 100%);
            transition: all 0.35s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .upload-zone:hover::before {
            opacity: 1;
        }

        .upload-zone:hover {
            border-color: rgba(59, 130, 246, 0.8);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(51, 65, 85, 0.4) 100%);
            transform: scale(1.01);
        }

        .input-modern {
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(100, 116, 139, 0.3);
            color: white;
            transition: all 0.3s ease;
        }

        .input-modern:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.8);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-gradient::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-gradient:hover::before {
            transform: translateX(100%);
        }

        .btn-gradient:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.6);
        }

        .btn-gradient:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-card {
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .metric-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(100, 116, 139, 0.2);
            transition: all 0.3s ease;
        }

        .metric-box:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        .shine {
            position: relative;
            overflow: hidden;
        }

        .shine::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        .loader {
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* تحسينات إضافية */
        .glow-text {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .pattern-dots {
            background-image: radial-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .scrollbar-custom::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-custom::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
        }

        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }

        .scrollbar-custom::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.8);
        }
    </style>
</head>
<body class="pattern-dots">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // أيقونات مخصصة
        const Icons = {
            Upload: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
            ),
            Zap: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
            ),
            TrendUp: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                    <polyline points="17 6 23 6 23 12"/>
                </svg>
            ),
            TrendDown: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
                    <polyline points="17 18 23 18 23 12"/>
                </svg>
            ),
            AlertCircle: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            ),
            CheckCircle: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            ),
            BarChart: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="12" y1="20" x2="12" y2="10"/>
                    <line x1="18" y1="20" x2="18" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="16"/>
                </svg>
            ),
            Target: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="6"/>
                    <circle cx="12" cy="12" r="2"/>
                </svg>
            )
        };

        // المكون الرئيسي
        const SmartChartAnalyzer = () => {
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [assetName, setAssetName] = useState('');
            const [currentPrice, setCurrentPrice] = useState('');
            const [timeframe, setTimeframe] = useState('يومي');
            const [analysis, setAnalysis] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const fileInputRef = useRef(null);

            const handleFileSelect = (e) => {
                const selectedFile = e.target.files?.[0];
                if (!selectedFile) return;

                // التحقق من نوع الملف
                if (!selectedFile.type.startsWith('image/')) {
                    setError('يرجى اختيار ملف صورة (PNG, JPG, WEBP)');
                    return;
                }

                // التحقق من حجم الملف (5MB)
                if (selectedFile.size > 5 * 1024 * 1024) {
                    setError('حجم الصورة يجب أن يكون أقل من 5 ميجابايت');
                    return;
                }

                setError('');
                setFile(selectedFile);

                // إنشاء معاينة
                const reader = new FileReader();
                reader.onload = (e) => setPreview(e.target.result);
                reader.readAsDataURL(selectedFile);
            };

            const analyzeChart = async () => {
                if (!preview || !assetName || !currentPrice) {
                    setError('يرجى ملء جميع الحقول المطلوبة');
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    // تحويل الصورة إلى base64
                    const base64Image = preview.split(',')[1];
                    const imageType = file.type;

                    // إنشاء prompt متقدم للتحليل
                    const prompt = `أنت محلل مالي وتقني خبير متخصص في تحليل الرسوم البيانية (Charts) للأصول المالية.

📊 معلومات الأصل:
- الاسم/الرمز: ${assetName}
- السعر الحالي: ${currentPrice}
- الإطار الزمني: ${timeframe}

🔍 المطلوب منك:
قم بتحليل شامل ودقيق للشارت المرفق وقدم تقريراً مفصلاً يتضمن:

1. **التحليل الفني**:
   - تحديد الاتجاه العام (صاعد/هابط/محايد)
   - رصد أنماط الشموع اليابانية (إن وجدت)
   - تحديد الأنماط الفنية (مثلثات، رأس وكتفين، أعلام، إلخ)
   - تحليل المؤشرات الفنية الظاهرة (RSI, MACD, Moving Averages)
   - تحديد مستويات الدعم والمقاومة الرئيسية

2. **تحليل حجم التداول**:
   - هل الحجم يدعم الاتجاه الحالي؟
   - هل هناك تباعد بين السعر والحجم؟

3. **القرار الاستثماري**:
   - التوصية: (شراء قوي / شراء / انتظار / بيع / بيع قوي)
   - مستوى الثقة: (نسبة مئوية من 0-100%)
   - السبب: (شرح تفصيلي للقرار)

4. **مستويات التداول المقترحة**:
   - نقطة الدخول المثالية
   - هدف الربح الأول (Take Profit 1)
   - هدف الربح الثاني (Take Profit 2)
   - وقف الخسارة (Stop Loss)

5. **التحذيرات والملاحظات**:
   - أي مخاطر محتملة
   - نقاط انعكاس مهمة
   - أحداث قادمة قد تؤثر على السعر

⚠️ مهم جداً:
- كن دقيقاً ومحترفاً في التحليل
- استخدم الأرقام الفعلية من الشارت
- قدم تحليلاً موضوعياً بناءً على ما تراه فقط
- لا تختلق معلومات غير موجودة في الشارت

📝 صيغة الإجابة:
أرجع النتائج بتنسيق JSON فقط (بدون أي نص إضافي قبله أو بعده):

{
  "decision": "شراء قوي / شراء / محايد / بيع / بيع قوي",
  "confidence": 85,
  "trend": "صاعد بقوة / صاعد / محايد / هابط / هابط بقوة",
  "reasoning": "شرح تفصيلي للقرار والتحليل الفني",
  "technicalIndicators": {
    "rsi": 65,
    "rsiStatus": "محايد / تشبع شرائي / تشبع بيعي",
    "macd": "إشارة شراء / إشارة بيع / محايد",
    "movingAverages": "السعر فوق المتوسطات / تحت المتوسطات"
  },
  "chartPatterns": ["نمط 1", "نمط 2"],
  "volumeAnalysis": "تحليل الحجم",
  "supportLevels": ["150.50", "148.20", "145.00"],
  "resistanceLevels": ["155.80", "158.50", "162.00"],
  "tradingLevels": {
    "entry": "152.30",
    "takeProfit1": "157.50",
    "takeProfit2": "162.00",
    "stopLoss": "149.80"
  },
  "riskLevel": "منخفض / متوسط / مرتفع",
  "warnings": ["تحذير 1", "تحذير 2"],
  "keyNotes": ["ملاحظة 1", "ملاحظة 2"],
  "marketSentiment": "متفائل جداً / متفائل / محايد / متشائم / متشائم جداً"
}`;

                    // استدعاء Claude API
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 4000,
                            messages: [
                                {
                                    role: 'user',
                                    content: [
                                        {
                                            type: 'image',
                                            source: {
                                                type: 'base64',
                                                media_type: imageType,
                                                data: base64Image,
                                            },
                                        },
                                        {
                                            type: 'text',
                                            text: prompt,
                                        },
                                    ],
                                },
                            ],
                        }),
                    });

                    if (!response.ok) {
                        throw new Error(`خطأ في الاتصال: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    // استخراج النص من الرد
                    let analysisText = '';
                    for (const block of data.content) {
                        if (block.type === 'text') {
                            analysisText += block.text;
                        }
                    }

                    // تنظيف وتحليل JSON
                    let cleanText = analysisText.trim();
                    // إزالة أي markdown code blocks
                    cleanText = cleanText.replace(/```json\n?/g, '').replace(/```\n?/g, '');
                    // إزالة أي نص قبل أو بعد JSON
                    const jsonMatch = cleanText.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        cleanText = jsonMatch[0];
                    }

                    const analysisResult = JSON.parse(cleanText);
                    
                    // إضافة معلومات إضافية
                    analysisResult.assetName = assetName;
                    analysisResult.currentPrice = currentPrice;
                    analysisResult.timeframe = timeframe;
                    analysisResult.analyzedAt = new Date().toLocaleString('ar-SA');

                    setAnalysis(analysisResult);
                } catch (err) {
                    console.error('خطأ في التحليل:', err);
                    setError(`حدث خطأ أثناء التحليل: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const resetAll = () => {
                setFile(null);
                setPreview(null);
                setAssetName('');
                setCurrentPrice('');
                setTimeframe('يومي');
                setAnalysis(null);
                setError('');
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
            };

            const getDecisionColor = (decision) => {
                if (decision.includes('شراء')) return 'emerald';
                if (decision.includes('بيع')) return 'rose';
                return 'amber';
            };

            const getDecisionIcon = (decision) => {
                if (decision.includes('شراء')) return <Icons.TrendUp />;
                if (decision.includes('بيع')) return <Icons.TrendDown />;
                return <Icons.AlertCircle />;
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-12">
                            <div className="flex items-center justify-center gap-4 mb-6">
                                <div className="text-5xl text-blue-400 animate-pulse">
                                    <Icons.Zap />
                                </div>
                                <h1 className="text-5xl md:text-6xl font-black bg-gradient-to-r from-blue-400 via-cyan-400 to-teal-400 bg-clip-text text-transparent glow-text">
                                    محلل الشارت الذكي
                                </h1>
                            </div>
                            <p className="text-slate-300 text-xl font-medium">
                                تحليل احترافي مدعوم بالذكاء الاصطناعي • نتائج فورية ودقيقة
                            </p>
                            <div className="flex items-center justify-center gap-3 mt-4">
                                <span className="px-4 py-1.5 bg-blue-500/20 text-blue-300 rounded-full text-sm font-semibold border border-blue-500/30 badge">
                                    مدعوم بـ Claude AI
                                </span>
                                <span className="px-4 py-1.5 bg-emerald-500/20 text-emerald-300 rounded-full text-sm font-semibold border border-emerald-500/30 badge">
                                    تحليل فني متقدم
                                </span>
                            </div>
                        </div>

                        {!analysis ? (
                            <div className="space-y-6">
                                {/* نموذج الإدخال */}
                                <div className="glass-card rounded-3xl p-8 md:p-10">
                                    <h2 className="text-3xl font-bold text-white mb-8 flex items-center gap-3">
                                        <Icons.BarChart />
                                        <span>معلومات الأصل</span>
                                    </h2>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                        <div>
                                            <label className="block text-slate-300 text-sm font-bold mb-3">
                                                اسم الأصل / الرمز *
                                            </label>
                                            <input
                                                type="text"
                                                value={assetName}
                                                onChange={(e) => setAssetName(e.target.value)}
                                                placeholder="مثال: BTC/USDT"
                                                className="input-modern w-full px-4 py-3.5 rounded-xl text-lg"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-slate-300 text-sm font-bold mb-3">
                                                السعر الحالي *
                                            </label>
                                            <input
                                                type="number"
                                                value={currentPrice}
                                                onChange={(e) => setCurrentPrice(e.target.value)}
                                                placeholder="0.00"
                                                step="any"
                                                className="input-modern w-full px-4 py-3.5 rounded-xl text-lg"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-slate-300 text-sm font-bold mb-3">
                                                الإطار الزمني
                                            </label>
                                            <select
                                                value={timeframe}
                                                onChange={(e) => setTimeframe(e.target.value)}
                                                className="input-modern w-full px-4 py-3.5 rounded-xl text-lg cursor-pointer"
                                            >
                                                <option>5 دقائق</option>
                                                <option>15 دقيقة</option>
                                                <option>1 ساعة</option>
                                                <option>4 ساعات</option>
                                                <option>يومي</option>
                                                <option>أسبوعي</option>
                                                <option>شهري</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* منطقة رفع الصورة */}
                                    <div className="mb-8">
                                        <label className="block text-slate-300 text-sm font-bold mb-3">
                                            رفع صورة الشارت *
                                        </label>
                                        <div
                                            className="upload-zone rounded-2xl p-12"
                                            onClick={() => fileInputRef.current?.click()}
                                        >
                                            <input
                                                ref={fileInputRef}
                                                type="file"
                                                accept="image/*"
                                                onChange={handleFileSelect}
                                                className="hidden"
                                            />
                                            <div className="flex flex-col items-center gap-5">
                                                <div className="text-7xl text-blue-400">
                                                    <Icons.Upload />
                                                </div>
                                                <div className="text-center">
                                                    <p className="text-2xl font-bold text-white mb-2">
                                                        اضغط لرفع صورة الشارت
                                                    </p>
                                                    <p className="text-slate-400 text-lg">
                                                        PNG, JPG, WEBP - حتى 5MB
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* معاينة الصورة */}
                                    {preview && (
                                        <div className="mb-8">
                                            <p className="text-slate-300 text-sm font-bold mb-4">
                                                معاينة الصورة
                                            </p>
                                            <div className="relative rounded-2xl overflow-hidden border-2 border-blue-500/30">
                                                <img
                                                    src={preview}
                                                    alt="معاينة"
                                                    className="w-full max-h-96 object-contain bg-slate-900/50"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    {/* رسالة الخطأ */}
                                    {error && (
                                        <div className="mb-6 p-4 bg-rose-500/20 border border-rose-500/50 rounded-xl flex items-start gap-3">
                                            <div className="text-rose-400 text-xl mt-0.5">
                                                <Icons.AlertCircle />
                                            </div>
                                            <p className="text-rose-300 font-medium">{error}</p>
                                        </div>
                                    )}

                                    {/* الأزرار */}
                                    <div className="flex flex-col sm:flex-row gap-4">
                                        <button
                                            onClick={analyzeChart}
                                            disabled={loading || !preview || !assetName || !currentPrice}
                                            className="btn-gradient flex-1 px-8 py-4 rounded-xl text-white font-bold text-lg flex items-center justify-center gap-3 shine"
                                        >
                                            {loading ? (
                                                <>
                                                    <div className="loader"></div>
                                                    <span>جاري التحليل...</span>
                                                </>
                                            ) : (
                                                <>
                                                    <Icons.Zap />
                                                    <span>تحليل الشارت الآن</span>
                                                </>
                                            )}
                                        </button>

                                        <button
                                            onClick={resetAll}
                                            className="px-8 py-4 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 font-bold text-lg transition-all border border-slate-600/50"
                                        >
                                            إعادة تعيين
                                        </button>
                                    </div>
                                </div>

                                {/* نصائح */}
                                <div className="glass-card rounded-3xl p-6">
                                    <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                                        <Icons.AlertCircle />
                                        <span>نصائح للحصول على أفضل تحليل</span>
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-slate-300">
                                        <div className="flex items-start gap-3">
                                            <div className="text-emerald-400 mt-1">
                                                <Icons.CheckCircle />
                                            </div>
                                            <p>استخدم صورة واضحة وعالية الجودة للشارت</p>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <div className="text-emerald-400 mt-1">
                                                <Icons.CheckCircle />
                                            </div>
                                            <p>تأكد من ظهور المؤشرات الفنية بوضوح</p>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <div className="text-emerald-400 mt-1">
                                                <Icons.CheckCircle />
                                            </div>
                                            <p>أدخل السعر الحالي الصحيح للحصول على توصيات دقيقة</p>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <div className="text-emerald-400 mt-1">
                                                <Icons.CheckCircle />
                                            </div>
                                            <p>اختر الإطار الزمني المناسب لاستراتيجيتك</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6 result-card">
                                {/* نتيجة التحليل */}
                                <div className={`glass-card rounded-3xl p-8 md:p-10 border-2 ${
                                    getDecisionColor(analysis.decision) === 'emerald' ? 'border-emerald-500/50' :
                                    getDecisionColor(analysis.decision) === 'rose' ? 'border-rose-500/50' :
                                    'border-amber-500/50'
                                }`}>
                                    <div className="flex items-center justify-between mb-8">
                                        <div>
                                            <h2 className="text-3xl font-black text-white mb-2">
                                                نتيجة التحليل
                                            </h2>
                                            <p className="text-slate-400">
                                                {analysis.assetName} • {analysis.timeframe} • {analysis.analyzedAt}
                                            </p>
                                        </div>
                                        <button
                                            onClick={resetAll}
                                            className="px-6 py-3 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white font-bold transition-all"
                                        >
                                            تحليل جديد
                                        </button>
                                    </div>

                                    {/* القرار الرئيسي */}
                                    <div className={`p-8 rounded-2xl bg-gradient-to-br ${
                                        getDecisionColor(analysis.decision) === 'emerald' ? 'from-emerald-900/50 to-emerald-800/30' :
                                        getDecisionColor(analysis.decision) === 'rose' ? 'from-rose-900/50 to-rose-800/30' :
                                        'from-amber-900/50 to-amber-800/30'
                                    } border ${
                                        getDecisionColor(analysis.decision) === 'emerald' ? 'border-emerald-500/50' :
                                        getDecisionColor(analysis.decision) === 'rose' ? 'border-rose-500/50' :
                                        'border-amber-500/50'
                                    } mb-8`}>
                                        <div className="flex items-center justify-between mb-6">
                                            <div className="flex items-center gap-4">
                                                <div className={`text-5xl ${
                                                    getDecisionColor(analysis.decision) === 'emerald' ? 'text-emerald-400' :
                                                    getDecisionColor(analysis.decision) === 'rose' ? 'text-rose-400' :
                                                    'text-amber-400'
                                                }`}>
                                                    {getDecisionIcon(analysis.decision)}
                                                </div>
                                                <div>
                                                    <p className="text-slate-400 text-sm font-semibold mb-1">
                                                        التوصية
                                                    </p>
                                                    <h3 className={`text-4xl font-black ${
                                                        getDecisionColor(analysis.decision) === 'emerald' ? 'text-emerald-300' :
                                                        getDecisionColor(analysis.decision) === 'rose' ? 'text-rose-300' :
                                                        'text-amber-300'
                                                    }`}>
                                                        {analysis.decision}
                                                    </h3>
                                                </div>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-slate-400 text-sm font-semibold mb-2">
                                                    مستوى الثقة
                                                </p>
                                                <div className="relative inline-block">
                                                    <svg className="w-24 h-24 transform -rotate-90">
                                                        <circle
                                                            cx="48"
                                                            cy="48"
                                                            r="40"
                                                            stroke="rgba(255,255,255,0.1)"
                                                            strokeWidth="8"
                                                            fill="none"
                                                        />
                                                        <circle
                                                            cx="48"
                                                            cy="48"
                                                            r="40"
                                                            stroke={
                                                                getDecisionColor(analysis.decision) === 'emerald' ? '#34d399' :
                                                                getDecisionColor(analysis.decision) === 'rose' ? '#fb7185' :
                                                                '#fbbf24'
                                                            }
                                                            strokeWidth="8"
                                                            fill="none"
                                                            strokeDasharray={`${2 * Math.PI * 40}`}
                                                            strokeDashoffset={`${2 * Math.PI * 40 * (1 - analysis.confidence / 100)}`}
                                                            strokeLinecap="round"
                                                        />
                                                    </svg>
                                                    <div className="absolute inset-0 flex items-center justify-center">
                                                        <span className="text-2xl font-black text-white">
                                                            {analysis.confidence}%
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-black/20 rounded-xl p-5">
                                            <p className="text-slate-300 text-lg leading-relaxed">
                                                {analysis.reasoning}
                                            </p>
                                        </div>
                                    </div>

                                    {/* المعلومات التفصيلية */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                                        <div className="metric-box p-5 rounded-xl">
                                            <p className="text-slate-400 text-sm font-semibold mb-2">
                                                الاتجاه العام
                                            </p>
                                            <p className="text-white text-xl font-bold">
                                                {analysis.trend}
                                            </p>
                                        </div>
                                        <div className="metric-box p-5 rounded-xl">
                                            <p className="text-slate-400 text-sm font-semibold mb-2">
                                                مستوى المخاطرة
                                            </p>
                                            <p className={`text-xl font-bold ${
                                                analysis.riskLevel === 'منخفض' ? 'text-emerald-400' :
                                                analysis.riskLevel === 'متوسط' ? 'text-amber-400' :
                                                'text-rose-400'
                                            }`}>
                                                {analysis.riskLevel}
                                            </p>
                                        </div>
                                        <div className="metric-box p-5 rounded-xl">
                                            <p className="text-slate-400 text-sm font-semibold mb-2">
                                                معنويات السوق
                                            </p>
                                            <p className="text-white text-xl font-bold">
                                                {analysis.marketSentiment}
                                            </p>
                                        </div>
                                        <div className="metric-box p-5 rounded-xl">
                                            <p className="text-slate-400 text-sm font-semibold mb-2">
                                                السعر الحالي
                                            </p>
                                            <p className="text-white text-xl font-bold">
                                                {analysis.currentPrice}
                                            </p>
                                        </div>
                                    </div>

                                    {/* المؤشرات الفنية */}
                                    <div className="glass-card rounded-2xl p-6 mb-8">
                                        <h3 className="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                                            <Icons.BarChart />
                                            <span>المؤشرات الفنية</span>
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div>
                                                <p className="text-slate-400 text-sm font-semibold mb-2">RSI</p>
                                                <p className="text-white text-2xl font-bold mb-1">
                                                    {analysis.technicalIndicators.rsi}
                                                </p>
                                                <p className="text-slate-400 text-sm">
                                                    {analysis.technicalIndicators.rsiStatus}
                                                </p>
                                            </div>
                                            <div>
                                                <p className="text-slate-400 text-sm font-semibold mb-2">MACD</p>
                                                <p className="text-white text-lg font-bold">
                                                    {analysis.technicalIndicators.macd}
                                                </p>
                                            </div>
                                            <div>
                                                <p className="text-slate-400 text-sm font-semibold mb-2">
                                                    المتوسطات المتحركة
                                                </p>
                                                <p className="text-white text-lg font-bold">
                                                    {analysis.technicalIndicators.movingAverages}
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* الأنماط الفنية */}
                                    {analysis.chartPatterns && analysis.chartPatterns.length > 0 && (
                                        <div className="glass-card rounded-2xl p-6 mb-8">
                                            <h3 className="text-2xl font-bold text-white mb-4">
                                                الأنماط الفنية المكتشفة
                                            </h3>
                                            <div className="flex flex-wrap gap-3">
                                                {analysis.chartPatterns.map((pattern, idx) => (
                                                    <span
                                                        key={idx}
                                                        className="px-4 py-2 bg-blue-500/20 text-blue-300 rounded-lg font-semibold border border-blue-500/30"
                                                    >
                                                        {pattern}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* مستويات الدعم والمقاومة */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                        <div className="glass-card rounded-2xl p-6">
                                            <h3 className="text-xl font-bold text-emerald-400 mb-4 flex items-center gap-2">
                                                <Icons.TrendUp />
                                                <span>مستويات الدعم</span>
                                            </h3>
                                            <div className="space-y-3">
                                                {analysis.supportLevels.map((level, idx) => (
                                                    <div
                                                        key={idx}
                                                        className="flex items-center justify-between p-3 bg-emerald-500/10 rounded-lg border border-emerald-500/30"
                                                    >
                                                        <span className="text-slate-400 font-semibold">
                                                            دعم {idx + 1}
                                                        </span>
                                                        <span className="text-emerald-300 font-bold text-lg">
                                                            {level}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="glass-card rounded-2xl p-6">
                                            <h3 className="text-xl font-bold text-rose-400 mb-4 flex items-center gap-2">
                                                <Icons.TrendDown />
                                                <span>مستويات المقاومة</span>
                                            </h3>
                                            <div className="space-y-3">
                                                {analysis.resistanceLevels.map((level, idx) => (
                                                    <div
                                                        key={idx}
                                                        className="flex items-center justify-between p-3 bg-rose-500/10 rounded-lg border border-rose-500/30"
                                                    >
                                                        <span className="text-slate-400 font-semibold">
                                                            مقاومة {idx + 1}
                                                        </span>
                                                        <span className="text-rose-300 font-bold text-lg">
                                                            {level}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* مستويات التداول المقترحة */}
                                    <div className="glass-card rounded-2xl p-6 mb-8">
                                        <h3 className="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                                            <Icons.Target />
                                            <span>خطة التداول المقترحة</span>
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                            <div className="p-5 bg-blue-500/10 rounded-xl border border-blue-500/30">
                                                <p className="text-blue-400 text-sm font-semibold mb-2">
                                                    نقطة الدخول
                                                </p>
                                                <p className="text-white text-2xl font-bold">
                                                    {analysis.tradingLevels.entry}
                                                </p>
                                            </div>
                                            <div className="p-5 bg-emerald-500/10 rounded-xl border border-emerald-500/30">
                                                <p className="text-emerald-400 text-sm font-semibold mb-2">
                                                    هدف الربح 1
                                                </p>
                                                <p className="text-white text-2xl font-bold">
                                                    {analysis.tradingLevels.takeProfit1}
                                                </p>
                                            </div>
                                            <div className="p-5 bg-emerald-500/10 rounded-xl border border-emerald-500/30">
                                                <p className="text-emerald-400 text-sm font-semibold mb-2">
                                                    هدف الربح 2
                                                </p>
                                                <p className="text-white text-2xl font-bold">
                                                    {analysis.tradingLevels.takeProfit2}
                                                </p>
                                            </div>
                                            <div className="p-5 bg-rose-500/10 rounded-xl border border-rose-500/30">
                                                <p className="text-rose-400 text-sm font-semibold mb-2">
                                                    وقف الخسارة
                                                </p>
                                                <p className="text-white text-2xl font-bold">
                                                    {analysis.tradingLevels.stopLoss}
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* التحذيرات */}
                                    {analysis.warnings && analysis.warnings.length > 0 && (
                                        <div className="glass-card rounded-2xl p-6 mb-8 border-2 border-amber-500/50">
                                            <h3 className="text-2xl font-bold text-amber-400 mb-4 flex items-center gap-2">
                                                <Icons.AlertCircle />
                                                <span>تحذيرات مهمة</span>
                                            </h3>
                                            <ul className="space-y-3">
                                                {analysis.warnings.map((warning, idx) => (
                                                    <li
                                                        key={idx}
                                                        className="flex items-start gap-3 text-slate-300"
                                                    >
                                                        <span className="text-amber-400 mt-1">⚠️</span>
                                                        <span>{warning}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}

                                    {/* ملاحظات إضافية */}
                                    {analysis.keyNotes && analysis.keyNotes.length > 0 && (
                                        <div className="glass-card rounded-2xl p-6">
                                            <h3 className="text-2xl font-bold text-white mb-4">
                                                ملاحظات مهمة
                                            </h3>
                                            <ul className="space-y-3">
                                                {analysis.keyNotes.map((note, idx) => (
                                                    <li
                                                        key={idx}
                                                        className="flex items-start gap-3 text-slate-300"
                                                    >
                                                        <span className="text-blue-400 mt-1">📌</span>
                                                        <span>{note}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>

                                {/* تنويه قانوني */}
                                <div className="glass-card rounded-2xl p-6 border-2 border-rose-500/30">
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        <strong className="text-rose-400">⚠️ تنويه هام:</strong> هذا التحليل مقدم
                                        لأغراض تعليمية فقط ولا يعتبر نصيحة استثمارية. يُنصح دائماً بإجراء بحثك الخاص
                                        واستشارة مستشار مالي مؤهل قبل اتخاذ أي قرارات استثمارية. التداول في الأسواق
                                        المالية ينطوي على مخاطر عالية وقد يؤدي إلى خسارة رأس المال.
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // تشغيل التطبيق
        ReactDOM.render(<SmartChartAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
