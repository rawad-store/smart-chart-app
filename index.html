<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الشارت الذكي - AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap');
        
        * { 
            font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 12px 48px 0 rgba(59, 130, 246, 0.2);
        }

        .upload-zone {
            border: 3px dashed rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.4) 0%, rgba(30, 41, 59, 0.3) 100%);
            transition: all 0.35s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .upload-zone:hover::before {
            opacity: 1;
        }

        .upload-zone:hover {
            border-color: rgba(59, 130, 246, 0.8);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(51, 65, 85, 0.4) 100%);
            transform: scale(1.01);
        }

        .input-modern {
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(100, 116, 139, 0.3);
            color: white;
            transition: all 0.3s ease;
        }

        .input-modern:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.8);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-gradient::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-gradient:hover::before {
            transform: translateX(100%);
        }

        .btn-gradient:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.6);
        }

        .btn-gradient:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-card {
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .pattern-dots {
            background-image: radial-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .metric-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(100, 116, 139, 0.2);
            transition: all 0.3s ease;
        }

        .metric-box:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .progress-bar {
            height: 6px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 3px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 100%; }
            100% { width: 0%; }
        }
    </style>
</head>
<body class="pattern-dots">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // الأيقونات
        const Icons = {
            Upload: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
            ),
            Zap: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
            ),
            TrendUp: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                    <polyline points="17 6 23 6 23 12"/>
                </svg>
            ),
            TrendDown: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
                    <polyline points="17 18 23 18 23 12"/>
                </svg>
            ),
            AlertCircle: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            ),
            CheckCircle: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            ),
            BarChart: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="12" y1="20" x2="12" y2="10"/>
                    <line x1="18" y1="20" x2="18" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="16"/>
                </svg>
            ),
            Target: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="6"/>
                    <circle cx="12" cy="12" r="2"/>
                </svg>
            ),
            Settings: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"/>
                </svg>
            ),
            Key: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
            ),
            X: () => (
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            )
        };

        // مكون مودال إعدادات API
        const ApiKeyModal = ({ isOpen, onClose, apiKey, setApiKey }) => {
            const [tempKey, setTempKey] = useState(apiKey || '');
            const [showKey, setShowKey] = useState(false);

            if (!isOpen) return null;

            const handleSave = () => {
                if (tempKey.trim()) {
                    setApiKey(tempKey.trim());
                    localStorage.setItem('anthropic_api_key', tempKey.trim());
                    onClose();
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content glass-card rounded-3xl p-8 max-w-2xl mx-4" onClick={(e) => e.stopPropagation()}>
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-2xl font-bold text-white flex items-center gap-3">
                                <Icons.Key />
                                <span>إعدادات API Key</span>
                            </h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors">
                                <div className="text-2xl"><Icons.X /></div>
                            </button>
                        </div>

                        <div className="space-y-6">
                            <div className="bg-blue-500/10 border border-blue-500/30 rounded-xl p-5">
                                <h3 className="text-blue-300 font-bold mb-2 flex items-center gap-2">
                                    <Icons.AlertCircle />
                                    <span>كيفية الحصول على API Key</span>
                                </h3>
                                <ol className="text-slate-300 text-sm space-y-2 mr-5">
                                    <li>1. اذهب إلى <a href="https://console.anthropic.com" target="_blank" className="text-blue-400 hover:underline">console.anthropic.com</a></li>
                                    <li>2. قم بإنشاء حساب أو تسجيل الدخول</li>
                                    <li>3. اذهب إلى API Keys في القائمة</li>
                                    <li>4. أنشئ مفتاح جديد وانسخه</li>
                                    <li>5. الصقه هنا في الحقل أدناه</li>
                                </ol>
                            </div>

                            <div>
                                <label className="block text-slate-300 text-sm font-bold mb-3">
                                    Anthropic API Key *
                                </label>
                                <div className="relative">
                                    <input
                                        type={showKey ? "text" : "password"}
                                        value={tempKey}
                                        onChange={(e) => setTempKey(e.target.value)}
                                        placeholder="sk-ant-api03-..."
                                        className="input-modern w-full px-4 py-3.5 rounded-xl text-lg pr-12"
                                        dir="ltr"
                                    />
                                    <button
                                        onClick={() => setShowKey(!showKey)}
                                        className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors"
                                    >
                                        {showKey ? '🙈' : '👁️'}
                                    </button>
                                </div>
                                <p className="text-slate-400 text-xs mt-2">
                                    ⚠️ المفتاح يُحفظ محلياً في متصفحك فقط ولن يُرسل لأي طرف ثالث
                                </p>
                            </div>

                            <div className="flex gap-4">
                                <button
                                    onClick={handleSave}
                                    disabled={!tempKey.trim()}
                                    className="btn-gradient flex-1 px-6 py-3.5 rounded-xl text-white font-bold text-lg disabled:opacity-50"
                                >
                                    حفظ المفتاح
                                </button>
                                <button
                                    onClick={onClose}
                                    className="px-6 py-3.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white font-bold transition-all"
                                >
                                    إلغاء
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // المكون الرئيسي
        const SmartChartAnalyzer = () => {
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [assetName, setAssetName] = useState('');
            const [currentPrice, setCurrentPrice] = useState('');
            const [timeframe, setTimeframe] = useState('يومي');
            const [analysis, setAnalysis] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [apiKey, setApiKey] = useState('');
            const [showApiModal, setShowApiModal] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const savedKey = localStorage.getItem('anthropic_api_key');
                if (savedKey) {
                    setApiKey(savedKey);
                }
            }, []);

            const handleFileSelect = (e) => {
                const selectedFile = e.target.files?.[0];
                if (!selectedFile) return;

                if (!selectedFile.type.startsWith('image/')) {
                    setError('يرجى اختيار ملف صورة (PNG, JPG, WEBP)');
                    return;
                }

                if (selectedFile.size > 5 * 1024 * 1024) {
                    setError('حجم الصورة يجب أن يكون أقل من 5 ميجابايت');
                    return;
                }

                setError('');
                setFile(selectedFile);

                const reader = new FileReader();
                reader.onload = (e) => setPreview(e.target.result);
                reader.readAsDataURL(selectedFile);
            };

            const analyzeChart = async () => {
                if (!apiKey) {
                    setError('يرجى إضافة API Key أولاً من زر الإعدادات');
                    setShowApiModal(true);
                    return;
                }

                if (!preview || !assetName || !currentPrice) {
                    setError('يرجى ملء جميع الحقول المطلوبة');
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    const base64Image = preview.split(',')[1];
                    const imageType = file.type;

                    const prompt = `أنت محلل مالي وتقني خبير متخصص في تحليل الرسوم البيانية للأصول المالية.

📊 **معلومات الأصل:**
- الاسم/الرمز: ${assetName}
- السعر الحالي: ${currentPrice}
- الإطار الزمني: ${timeframe}

🔍 **التحليل المطلوب:**

قم بتحليل الشارت المرفق بدقة عالية وقدم تقريراً شاملاً يتضمن:

1. **القرار الاستثماري الرئيسي:**
   - التوصية الواضحة: (شراء قوي / شراء / محايد / بيع / بيع قوي)
   - مستوى الثقة: نسبة من 0-100%
   - الاتجاه العام: (صاعد بقوة / صاعد / محايد / هابط / هابط بقوة)

2. **التحليل الفني التفصيلي:**
   - مؤشر RSI: القيمة والحالة (تشبع شرائي/بيعي/محايد)
   - مؤشر MACD: الإشارة الحالية
   - المتوسطات المتحركة: موقع السعر منها
   - الأنماط الفنية المكتشفة (مثلثات، أعلام، رأس وكتفين، إلخ)

3. **مستويات الدعم والمقاومة:**
   - 3 مستويات دعم رئيسية (من الأقرب للأبعد)
   - 3 مستويات مقاومة رئيسية (من الأقرب للأبعد)

4. **خطة التداول:**
   - نقطة الدخول المثالية
   - هدف الربح الأول (Take Profit 1)
   - هدف الربح الثاني (Take Profit 2)
   - وقف الخسارة (Stop Loss)

5. **معلومات إضافية:**
   - تحليل حجم التداول
   - مستوى المخاطرة (منخفض/متوسط/مرتفع)
   - معنويات السوق
   - تحذيرات مهمة (على الأقل 2-3)
   - ملاحظات رئيسية (على الأقل 2-3)

⚠️ **مهم جداً:**
- استخدم الأرقام الفعلية من الشارت فقط
- كن دقيقاً ومحترفاً في التحليل
- قدم تحليلاً موضوعياً بناءً على ما تراه
- أذكر السبب التفصيلي للتوصية

📝 **صيغة الإجابة (JSON فقط بدون أي نص إضافي):**

{
  "decision": "",
  "confidence": 0,
  "trend": "",
  "reasoning": "تحليل تفصيلي للقرار مع ذكر الأسباب الفنية",
  "technicalIndicators": {
    "rsi": 0,
    "rsiStatus": "",
    "macd": "",
    "movingAverages": ""
  },
  "chartPatterns": ["", ""],
  "volumeAnalysis": "",
  "supportLevels": ["", "", ""],
  "resistanceLevels": ["", "", ""],
  "tradingLevels": {
    "entry": "",
    "takeProfit1": "",
    "takeProfit2": "",
    "stopLoss": ""
  },
  "riskLevel": "",
  "warnings": ["", "", ""],
  "keyNotes": ["", "", ""],
  "marketSentiment": ""
}`;

                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'anthropic-version': '2023-06-01',
                            'x-api-key': apiKey
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 4096,
                            messages: [{
                                role: 'user',
                                content: [
                                    {
                                        type: 'image',
                                        source: {
                                            type: 'base64',
                                            media_type: imageType,
                                            data: base64Image,
                                        },
                                    },
                                    {
                                        type: 'text',
                                        text: prompt,
                                    },
                                ],
                            }],
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        if (response.status === 401) {
                            throw new Error('مفتاح API غير صحيح. يرجى التحقق من المفتاح وإعادة المحاولة.');
                        }
                        throw new Error(errorData.error?.message || `خطأ ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();
                    
                    let analysisText = '';
                    for (const block of data.content) {
                        if (block.type === 'text') {
                            analysisText += block.text;
                        }
                    }

                    let cleanText = analysisText.trim();
                    cleanText = cleanText.replace(/```json\n?/g, '').replace(/```\n?/g, '');
                    const jsonMatch = cleanText.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        cleanText = jsonMatch[0];
                    }

                    const analysisResult = JSON.parse(cleanText);
                    analysisResult.assetName = assetName;
                    analysisResult.currentPrice = currentPrice;
                    analysisResult.timeframe = timeframe;
                    analysisResult.analyzedAt = new Date().toLocaleString('ar-SA');

                    setAnalysis(analysisResult);
                } catch (err) {
                    console.error('خطأ في التحليل:', err);
                    setError(err.message || 'حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.');
                } finally {
                    setLoading(false);
                }
            };

            const resetAll = () => {
                setFile(null);
                setPreview(null);
                setAssetName('');
                setCurrentPrice('');
                setTimeframe('يومي');
                setAnalysis(null);
                setError('');
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
            };

            const getDecisionColor = (decision) => {
                if (decision?.includes('شراء')) return 'emerald';
                if (decision?.includes('بيع')) return 'rose';
                return 'amber';
            };

            const getDecisionIcon = (decision) => {
                if (decision?.includes('شراء')) return <Icons.TrendUp />;
                if (decision?.includes('بيع')) return <Icons.TrendDown />;
                return <Icons.AlertCircle />;
            };

            return (
                <>
                    <ApiKeyModal 
                        isOpen={showApiModal} 
                        onClose={() => setShowApiModal(false)}
                        apiKey={apiKey}
                        setApiKey={setApiKey}
                    />

                    <div className="min-h-screen p-4 md:p-8">
                        <div className="max-w-6xl mx-auto">
                            {/* Header */}
                            <div className="text-center mb-8 md:mb-12">
                                <div className="flex items-center justify-between mb-6">
                                    <div className="flex-1"></div>
                                    <div className="flex items-center gap-4">
                                        <div className="text-4xl md:text-5xl text-blue-400 animate-pulse">
                                            <Icons.Zap />
                                        </div>
                                        <h1 className="text-3xl md:text-6xl font-black bg-gradient-to-r from-blue-400 via-cyan-400 to-teal-400 bg-clip-text text-transparent glow-text">
                                            محلل الشارت الذكي
                                        </h1>
                                    </div>
                                    <div className="flex-1 flex justify-end">
                                        <button
                                            onClick={() => setShowApiModal(true)}
                                            className="p-3 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 hover:text-white transition-all border border-slate-600/50"
                                            title="إعدادات API"
                                        >
                                            <div className="text-xl"><Icons.Settings /></div>
                                        </button>
                                    </div>
                                </div>
                                <p className="text-slate-300 text-base md:text-xl font-medium">
                                    تحليل احترافي مدعوم بالذكاء الاصطناعي • نتائج فورية ودقيقة
                                </p>
                                <div className="flex items-center justify-center gap-3 mt-4 flex-wrap">
                                    <span className="px-4 py-1.5 bg-blue-500/20 text-blue-300 rounded-full text-sm font-semibold border border-blue-500/30 badge">
                                        مدعوم بـ Claude AI
                                    </span>
                                    <span className="px-4 py-1.5 bg-emerald-500/20 text-emerald-300 rounded-full text-sm font-semibold border border-emerald-500/30 badge">
                                        تحليل فني متقدم
                                    </span>
                                    {apiKey && (
                                        <span className="px-4 py-1.5 bg-green-500/20 text-green-300 rounded-full text-sm font-semibold border border-green-500/30">
                                            ✓ API متصل
                                        </span>
                                    )}
                                </div>
                            </div>

                            {!analysis ? (
                                <div className="space-y-6">
                                    <div className="glass-card rounded-3xl p-6 md:p-10">
                                        <h2 className="text-2xl md:text-3xl font-bold text-white mb-6 flex items-center gap-3">
                                            <Icons.BarChart />
                                            <span>معلومات الأصل</span>
                                        </h2>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-6">
                                            <div>
                                                <label className="block text-slate-300 text-sm font-bold mb-3">
                                                    اسم الأصل / الرمز *
                                                </label>
                                                <input
                                                    type="text"
                                                    value={assetName}
                                                    onChange={(e) => setAssetName(e.target.value)}
                                                    placeholder="مثال: BTC/USDT"
                                                    className="input-modern w-full px-4 py-3 md:py-3.5 rounded-xl text-base md:text-lg"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-slate-300 text-sm font-bold mb-3">
                                                    السعر الحالي *
                                                </label>
                                                <input
                                                    type="number"
                                                    value={currentPrice}
                                                    onChange={(e) => setCurrentPrice(e.target.value)}
                                                    placeholder="0.00"
                                                    step="any"
                                                    className="input-modern w-full px-4 py-3 md:py-3.5 rounded-xl text-base md:text-lg"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-slate-300 text-sm font-bold mb-3">
                                                    الإطار الزمني
                                                </label>
                                                <select
                                                    value={timeframe}
                                                    onChange={(e) => setTimeframe(e.target.value)}
                                                    className="input-modern w-full px-4 py-3 md:py-3.5 rounded-xl text-base md:text-lg cursor-pointer"
                                                >
                                                    <option>1 دقيقة</option>
                                                    <option>5 دقائق</option>
                                                    <option>15 دقيقة</option>
                                                    <option>30 دقيقة</option>
                                                    <option>1 ساعة</option>
                                                    <option>4 ساعات</option>
                                                    <option>يومي</option>
                                                    <option>أسبوعي</option>
                                                    <option>شهري</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="mb-6">
                                            <label className="block text-slate-300 text-sm font-bold mb-3">
                                                رفع صورة الشارت *
                                            </label>
                                            <div
                                                className="upload-zone rounded-2xl p-8 md:p-12"
                                                onClick={() => fileInputRef.current?.click()}
                                            >
                                                <input
                                                    ref={fileInputRef}
                                                    type="file"
                                                    accept="image/*"
                                                    onChange={handleFileSelect}
                                                    className="hidden"
                                                />
                                                <div className="flex flex-col items-center gap-4">
                                                    <div className="text-5xl md:text-7xl text-blue-400">
                                                        <Icons.Upload />
                                                    </div>
                                                    <div className="text-center">
                                                        <p className="text-xl md:text-2xl font-bold text-white mb-2">
                                                            اضغط لرفع صورة الشارت
                                                        </p>
                                                        <p className="text-slate-400 text-base md:text-lg">
                                                            PNG, JPG, WEBP - حتى 5MB
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {preview && (
                                            <div className="mb-6">
                                                <p className="text-slate-300 text-sm font-bold mb-4">
                                                    معاينة الصورة
                                                </p>
                                                <div className="relative rounded-2xl overflow-hidden border-2 border-blue-500/30">
                                                    <img
                                                        src={preview}
                                                        alt="معاينة"
                                                        className="w-full max-h-96 object-contain bg-slate-900/50"
                                                    />
                                                </div>
                                            </div>
                                        )}

                                        {error && (
                                            <div className="mb-6 p-4 bg-rose-500/20 border border-rose-500/50 rounded-xl flex items-start gap-3">
                                                <div className="text-rose-400 text-xl mt-0.5 flex-shrink-0">
                                                    <Icons.AlertCircle />
                                                </div>
                                                <p className="text-rose-300 font-medium text-sm md:text-base">{error}</p>
                                            </div>
                                        )}

                                        {loading && (
                                            <div className="mb-6">
                                                <div className="progress-bar mb-3">
                                                    <div className="progress-fill"></div>
                                                </div>
                                                <p className="text-center text-slate-400 text-sm">
                                                    جاري تحليل الشارت بواسطة الذكاء الاصطناعي...
                                                </p>
                                            </div>
                                        )}

                                        <div className="flex flex-col sm:flex-row gap-4">
                                            <button
                                                onClick={analyzeChart}
                                                disabled={loading || !preview || !assetName || !currentPrice}
                                                className="btn-gradient flex-1 px-6 md:px-8 py-3 md:py-4 rounded-xl text-white font-bold text-base md:text-lg flex items-center justify-center gap-3"
                                            >
                                                {loading ? (
                                                    <>
                                                        <div className="loader"></div>
                                                        <span>جاري التحليل...</span>
                                                    </>
                                                ) : (
                                                    <>
                                                        <Icons.Zap />
                                                        <span>تحليل الشارت الآن</span>
                                                    </>
                                                )}
                                            </button>

                                            <button
                                                onClick={resetAll}
                                                className="px-6 md:px-8 py-3 md:py-4 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 font-bold text-base md:text-lg transition-all border border-slate-600/50"
                                            >
                                                إعادة تعيين
                                            </button>
                                        </div>
                                    </div>

                                    <div className="glass-card rounded-3xl p-6">
                                        <h3 className="text-lg md:text-xl font-bold text-white mb-4 flex items-center gap-2">
                                            <Icons.AlertCircle />
                                            <span>نصائح للحصول على أفضل تحليل</span>
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-slate-300 text-sm md:text-base">
                                            <div className="flex items-start gap-3">
                                                <div className="text-emerald-400 mt-1 flex-shrink-0">
                                                    <Icons.CheckCircle />
                                                </div>
                                                <p>استخدم صورة واضحة وعالية الجودة للشارت</p>
                                            </div>
                                            <div className="flex items-start gap-3">
                                                <div className="text-emerald-400 mt-1 flex-shrink-0">
                                                    <Icons.CheckCircle />
                                                </div>
                                                <p>تأكد من ظهور المؤشرات الفنية بوضوح</p>
                                            </div>
                                            <div className="flex items-start gap-3">
                                                <div className="text-emerald-400 mt-1 flex-shrink-0">
                                                    <Icons.CheckCircle />
                                                </div>
                                                <p>أدخل السعر الحالي الصحيح للحصول على توصيات دقيقة</p>
                                            </div>
                                            <div className="flex items-start gap-3">
                                                <div className="text-emerald-400 mt-1 flex-shrink-0">
                                                    <Icons.CheckCircle />
                                                </div>
                                                <p>اختر الإطار الزمني المناسب لاستراتيجيتك</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-6 result-card">
                                    {/* نتائج التحليل الكاملة */}
                                    <div className={`glass-card rounded-3xl p-6 md:p-10 border-2 ${
                                        getDecisionColor(analysis.decision) === 'emerald' ? 'border-emerald-500/50' :
                                        getDecisionColor(analysis.decision) === 'rose' ? 'border-rose-500/50' :
                                        'border-amber-500/50'
                                    }`}>
                                        <div className="flex items-center justify-between mb-8 flex-wrap gap-4">
                                            <div>
                                                <h2 className="text-2xl md:text-3xl font-black text-white mb-2">
                                                    نتيجة التحليل
                                                </h2>
                                                <p className="text-slate-400 text-sm md:text-base">
                                                    {analysis.assetName} • {analysis.timeframe} • {analysis.analyzedAt}
                                                </p>
                                            </div>
                                            <button
                                                onClick={resetAll}
                                                className="px-4 md:px-6 py-2 md:py-3 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white font-bold transition-all text-sm md:text-base"
                                            >
                                                تحليل جديد
                                            </button>
                                        </div>

                                        {/* القرار الرئيسي */}
                                        <div className={`p-6 md:p-8 rounded-2xl bg-gradient-to-br ${
                                            getDecisionColor(analysis.decision) === 'emerald' ? 'from-emerald-900/50 to-emerald-800/30 border-emerald-500/50' :
                                            getDecisionColor(analysis.decision) === 'rose' ? 'from-rose-900/50 to-rose-800/30 border-rose-500/50' :
                                            'from-amber-900/50 to-amber-800/30 border-amber-500/50'
                                        } border mb-8`}>
                                            <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
                                                <div className="flex items-center gap-4">
                                                    <div className={`text-4xl md:text-5xl ${
                                                        getDecisionColor(analysis.decision) === 'emerald' ? 'text-emerald-400' :
                                                        getDecisionColor(analysis.decision) === 'rose' ? 'text-rose-400' :
                                                        'text-amber-400'
                                                    }`}>
                                                        {getDecisionIcon(analysis.decision)}
                                                    </div>
                                                    <div>
                                                        <p className="text-slate-400 text-xs md:text-sm font-semibold mb-1">
                                                            التوصية
                                                        </p>
                                                        <h3 className={`text-2xl md:text-4xl font-black ${
                                                            getDecisionColor(analysis.decision) === 'emerald' ? 'text-emerald-300' :
                                                            getDecisionColor(analysis.decision) === 'rose' ? 'text-rose-300' :
                                                            'text-amber-300'
                                                        }`}>
                                                            {analysis.decision}
                                                        </h3>
                                                    </div>
                                                </div>
                                                <div className="text-center">
                                                    <p className="text-slate-400 text-xs md:text-sm font-semibold mb-2">
                                                        مستوى الثقة
                                                    </p>
                                                    <div className="text-3xl md:text-4xl font-black text-white">
                                                        {analysis.confidence}%
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="bg-black/20 rounded-xl p-4 md:p-5">
                                                <p className="text-slate-300 text-base md:text-lg leading-relaxed">
                                                    {analysis.reasoning}
                                                </p>
                                            </div>
                                        </div>

                                        {/* بقية التفاصيل - مختصرة للحفاظ على الأداء */}
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                            <div className="metric-box p-4 md:p-5 rounded-xl">
                                                <p className="text-slate-400 text-xs md:text-sm font-semibold mb-2">
                                                    الاتجاه العام
                                                </p>
                                                <p className="text-white text-base md:text-xl font-bold">
                                                    {analysis.trend}
                                                </p>
                                            </div>
                                            <div className="metric-box p-4 md:p-5 rounded-xl">
                                                <p className="text-slate-400 text-xs md:text-sm font-semibold mb-2">
                                                    المخاطرة
                                                </p>
                                                <p className={`text-base md:text-xl font-bold ${
                                                    analysis.riskLevel === 'منخفض' ? 'text-emerald-400' :
                                                    analysis.riskLevel === 'متوسط' ? 'text-amber-400' :
                                                    'text-rose-400'
                                                }`}>
                                                    {analysis.riskLevel}
                                                </p>
                                            </div>
                                            <div className="metric-box p-4 md:p-5 rounded-xl col-span-2">
                                                <p className="text-slate-400 text-xs md:text-sm font-semibold mb-2">
                                                    معنويات السوق
                                                </p>
                                                <p className="text-white text-base md:text-xl font-bold">
                                                    {analysis.marketSentiment}
                                                </p>
                                            </div>
                                        </div>

                                        {/* مستويات التداول */}
                                        {analysis.tradingLevels && (
                                            <div className="glass-card rounded-2xl p-6 mb-8">
                                                <h3 className="text-xl md:text-2xl font-bold text-white mb-6 flex items-center gap-2">
                                                    <Icons.Target />
                                                    <span>خطة التداول</span>
                                                </h3>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                                    <div className="p-4 md:p-5 bg-blue-500/10 rounded-xl border border-blue-500/30">
                                                        <p className="text-blue-400 text-xs md:text-sm font-semibold mb-2">
                                                            الدخول
                                                        </p>
                                                        <p className="text-white text-lg md:text-2xl font-bold">
                                                            {analysis.tradingLevels.entry}
                                                        </p>
                                                    </div>
                                                    <div className="p-4 md:p-5 bg-emerald-500/10 rounded-xl border border-emerald-500/30">
                                                        <p className="text-emerald-400 text-xs md:text-sm font-semibold mb-2">
                                                            هدف 1
                                                        </p>
                                                        <p className="text-white text-lg md:text-2xl font-bold">
                                                            {analysis.tradingLevels.takeProfit1}
                                                        </p>
                                                    </div>
                                                    <div className="p-4 md:p-5 bg-emerald-500/10 rounded-xl border border-emerald-500/30">
                                                        <p className="text-emerald-400 text-xs md:text-sm font-semibold mb-2">
                                                            هدف 2
                                                        </p>
                                                        <p className="text-white text-lg md:text-2xl font-bold">
                                                            {analysis.tradingLevels.takeProfit2}
                                                        </p>
                                                    </div>
                                                    <div className="p-4 md:p-5 bg-rose-500/10 rounded-xl border border-rose-500/30">
                                                        <p className="text-rose-400 text-xs md:text-sm font-semibold mb-2">
                                                            وقف الخسارة
                                                        </p>
                                                        <p className="text-white text-lg md:text-2xl font-bold">
                                                            {analysis.tradingLevels.stopLoss}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* التحذيرات */}
                                        {analysis.warnings && analysis.warnings.length > 0 && (
                                            <div className="glass-card rounded-2xl p-6 mb-8 border-2 border-amber-500/50">
                                                <h3 className="text-xl md:text-2xl font-bold text-amber-400 mb-4 flex items-center gap-2">
                                                    <Icons.AlertCircle />
                                                    <span>تحذيرات مهمة</span>
                                                </h3>
                                                <ul className="space-y-3">
                                                    {analysis.warnings.map((warning, idx) => (
                                                        <li key={idx} className="flex items-start gap-3 text-slate-300 text-sm md:text-base">
                                                            <span className="text-amber-400 mt-1">⚠️</span>
                                                            <span>{warning}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}
                                    </div>

                                    {/* تنويه قانوني */}
                                    <div className="glass-card rounded-2xl p-6 border-2 border-rose-500/30">
                                        <p className="text-slate-300 text-xs md:text-sm leading-relaxed">
                                            <strong className="text-rose-400">⚠️ تنويه هام:</strong> هذا التحليل مقدم
                                            لأغراض تعليمية فقط ولا يعتبر نصيحة استثمارية. استشر مستشاراً مالياً مؤهلاً قبل اتخاذ قرارات استثمارية.
                                            التداول في الأسواق المالية ينطوي على مخاطر عالية.
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </>
            );
        };

        ReactDOM.render(<SmartChartAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
