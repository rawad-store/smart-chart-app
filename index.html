<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الشارت الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استخدام الإصدارات المستقرة من React -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel للكتابة بـ JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
        
        * { 
            font-family: 'Outfit', system-ui, sans-serif; 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom right, #0f172a, #1e1b4b, #0f172a);
            min-height: 100vh;
        }

        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(100, 200, 255, 0.18);
            border-radius: 16px;
            transition: all 0.35s ease;
        }

        .glass:hover {
            border-color: rgba(100, 200, 255, 0.35);
            background: rgba(15, 23, 42, 0.8);
            transform: translateY(-3px);
        }

        .upload-area {
            border: 2px dashed rgba(100, 200, 255, 0.35);
            border-radius: 16px;
            padding: 3rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(2, 13, 46, 0.3);
        }

        .upload-area:hover {
            border-color: rgba(100, 200, 255, 0.6);
            background: rgba(2, 13, 46, 0.45);
        }

        .input-field {
            background: rgba(3, 7, 30, 0.7);
            border: 1px solid rgba(100, 200, 255, 0.22);
            border-radius: 10px;
            padding: 0.9rem 1.1rem;
            color: white;
            transition: all 0.25s;
            width: 100%;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(100, 200, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            padding: 0.9rem 2rem;
            border-radius: 10px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
            transition: all 0.3s;
            border: none;
            color: white;
            cursor: pointer;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(59, 130, 246, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-reset {
            background: rgba(100, 200, 255, 0.12);
            color: #7dd3fc;
            border: 1px solid rgba(100, 200, 255, 0.35);
            padding: 0.8rem 1.8rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-reset:hover {
            background: rgba(100, 200, 255, 0.22);
            border-color: rgba(100, 200, 255, 0.6);
        }

        .decision-box {
            background: linear-gradient(135deg, rgba(15,23,42,0.92), rgba(30,41,59,0.75));
            border: 2px solid rgba(100,200,255,0.25);
            border-radius: 20px;
            padding: 2.5rem;
            animation: fadeUp 0.7s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(35px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.6s ease;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid rgba(100, 200, 255, 0.15);
        }

        /* تعريف الأيقونات يدوياً */
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // دوال مساعدة لإنشاء الأيقونات
        function createIcon(children) {
            return function(props) {
                return React.createElement('svg', 
                    { 
                        className: props?.className || '',
                        width: props?.size || '1em', 
                        height: props?.size || '1em',
                        viewBox: '0 0 24 24',
                        fill: 'none',
                        stroke: 'currentColor',
                        strokeWidth: '2',
                        strokeLinecap: 'round',
                        strokeLinejoin: 'round'
                    },
                    ...(Array.isArray(children) ? children : [children])
                );
            };
        }

        // تعريف الأيقونات
        const FiUpload = createIcon([
            React.createElement('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4', key: '1' }),
            React.createElement('polyline', { points: '17 8 12 3 7 8', key: '2' }),
            React.createElement('line', { x1: '12', y1: '3', x2: '12', y2: '15', key: '3' })
        ]);

        const FiZap = createIcon([
            React.createElement('polygon', { points: '13 2 3 14 12 14 11 22 21 10 12 10 13 2', key: '1' })
        ]);

        const FiTrendingUp = createIcon([
            React.createElement('polyline', { points: '23 6 13.5 15.5 8 10 1 18', key: '1' }),
            React.createElement('polyline', { points: '17 6 23 6 23 12', key: '2' })
        ]);

        const FiTrendingDown = createIcon([
            React.createElement('polyline', { points: '23 18 13.5 8.5 8 14 1 7', key: '1' }),
            React.createElement('polyline', { points: '17 18 23 18 23 12', key: '2' })
        ]);

        const FiAlertCircle = createIcon([
            React.createElement('circle', { cx: '12', cy: '12', r: '10', key: '1' }),
            React.createElement('line', { x1: '12', y1: '8', x2: '12', y2: '12', key: '2' }),
            React.createElement('circle', { cx: '12', cy: '16', r: '1', key: '3' })
        ]);

        const FiLoader = createIcon([
            React.createElement('line', { x1: '12', y1: '2', x2: '12', y2: '6', key: '1' }),
            React.createElement('line', { x1: '12', y1: '18', x2: '12', y2: '22', key: '2' }),
            React.createElement('line', { x1: '4.93', y1: '4.93', x2: '7.76', y2: '7.76', key: '3' }),
            React.createElement('line', { x1: '16.24', y1: '16.24', x2: '19.07', y2: '19.07', key: '4' }),
            React.createElement('line', { x1: '2', y1: '12', x2: '6', y2: '12', key: '5' }),
            React.createElement('line', { x1: '18', y1: '12', x2: '22', y2: '12', key: '6' }),
            React.createElement('line', { x1: '4.93', y1: '19.07', x2: '7.76', y2: '16.24', key: '7' }),
            React.createElement('line', { x1: '16.24', y1: '7.76', x2: '19.07', y2: '4.93', key: '8' })
        ]);

        // مكون SmartChartAnalyzer
        const SmartChartAnalyzer = () => {
            const [selectedFile, setSelectedFile] = React.useState(null);
            const [preview, setPreview] = React.useState(null);
            const [analysis, setAnalysis] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const [assetName, setAssetName] = React.useState('');
            const [currentPrice, setCurrentPrice] = React.useState('');
            const fileInputRef = React.useRef(null);

            const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5 ميجابايت

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    alert('يرجى اختيار ملف صورة فقط');
                    return;
                }

                if (file.size > MAX_FILE_SIZE) {
                    alert('حجم الصورة كبير جداً (الحد الأقصى 5 ميجابايت)');
                    return;
                }

                setSelectedFile(file);
                const reader = new FileReader();
                reader.onload = (ev) => setPreview(ev.target.result);
                reader.readAsDataURL(file);
            };

            const analyzeChart = async () => {
                if (!preview || !assetName || !currentPrice) {
                    alert('يرجى ملء جميع الحقول');
                    return;
                }

                setLoading(true);

                try {
                    const mockAnalysis = performChartAnalysis();
                    await new Promise((r) => setTimeout(r, 1800));
                    setAnalysis(mockAnalysis);
                } catch (error) {
                    console.error(error);
                    alert('حدث خطأ أثناء التحليل');
                } finally {
                    setLoading(false);
                }
            };

            const performChartAnalysis = () => {
                const technicalScore = Math.floor(Math.random() * 7) - 3;
                const fundamentalScore = Math.floor(Math.random() * 5) - 2;
                const riskScore = Math.floor(Math.random() * 5) - 2;

                const totalScore = technicalScore + fundamentalScore + riskScore;

                let decision = 'محايد';
                let confidence = 55;
                let color = 'yellow';
                let trend = 'محايد';

                if (totalScore >= 5) {
                    decision = 'شراء قوي';
                    confidence = 88;
                    color = 'green';
                    trend = 'صاعد جداً';
                } else if (totalScore >= 2) {
                    decision = 'شراء';
                    confidence = 72;
                    color = 'green';
                    trend = 'صاعد';
                } else if (totalScore <= -5) {
                    decision = 'بيع قوي';
                    confidence = 88;
                    color = 'red';
                    trend = 'هابط جداً';
                } else if (totalScore <= -2) {
                    decision = 'بيع';
                    confidence = 72;
                    color = 'red';
                    trend = 'هابط';
                }

                const price = parseFloat(currentPrice) || 100;

                return {
                    decision,
                    confidence,
                    color,
                    trend,
                    technicalScore,
                    fundamentalScore,
                    riskScore,
                    totalScore,
                    chartPatterns: ['كسر مقاومة', 'مثلث صاعد', 'رأس وكتفين معكوس', 'علم صاعد'].sort(() => Math.random() - 0.5).slice(0, 2 + Math.floor(Math.random() * 2)),
                    supportLevels: [(price * 0.96).toFixed(2), (price * 0.92).toFixed(2), (price * 0.87).toFixed(2)],
                    resistanceLevels: [(price * 1.04).toFixed(2), (price * 1.09).toFixed(2), (price * 1.15).toFixed(2)],
                    rsiValue: Math.floor(30 + Math.random() * 70),
                    macdTrend: ['صاعد', 'هابط', 'محايد'][Math.floor(Math.random() * 3)],
                    volumeTrend: ['مرتفع', 'متوسط', 'منخفض'][Math.floor(Math.random() * 3)],
                    recommendedEntryPrice: (price * (0.975 + Math.random() * 0.05)).toFixed(2),
                    recommendedTakeProfit: (price * (1.07 + Math.random() * 0.18)).toFixed(2),
                    recommendedStopLoss: (price * (0.915 + Math.random() * 0.04)).toFixed(2),
                };
            };

            const resetForm = () => {
                setSelectedFile(null);
                setPreview(null);
                setAnalysis(null);
                setAssetName('');
                setCurrentPrice('');
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const colorClass = {
                green: 'text-emerald-500',
                red: 'text-rose-500',
                yellow: 'text-amber-500',
            };

            const bgColorClass = {
                green: 'from-emerald-950 to-emerald-900 border-emerald-700/50',
                red: 'from-rose-950 to-rose-900 border-rose-700/50',
                yellow: 'from-amber-950 to-amber-900 border-amber-700/50',
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 p-5 md:p-8 text-right" dir="rtl">
                    <div className="max-w-5xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-10">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <div className="text-blue-400" style={{ fontSize: '44px' }}>
                                    <FiZap />
                                </div>
                                <h1 className="text-4xl md:text-5xl font-extrabold bg-gradient-to-r from-cyan-300 via-blue-300 to-indigo-400 bg-clip-text text-transparent">
                                    محلل الشارت الذكي
                                </h1>
                            </div>
                            <p className="text-slate-400 text-lg">
                                ارفع صورة الشارت واحصل على تحليل سريع + توصية واضحة
                            </p>
                        </div>

                        {!analysis ? (
                            <div className="space-y-8">
                                <div className="glass p-7 md:p-10">
                                    <h2 className="text-2xl font-bold text-white mb-7">البيانات الأساسية</h2>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-9">
                                        <div>
                                            <label className="block text-slate-300 text-sm font-semibold mb-3">اسم الأصل / الرمز</label>
                                            <input
                                                type="text"
                                                value={assetName}
                                                onChange={(e) => setAssetName(e.target.value)}
                                                placeholder="مثال: BTCUSDT • AAPL • 7203.SR"
                                                className="input-field w-full"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-300 text-sm font-semibold mb-3">السعر الحالي</label>
                                            <input
                                                type="number"
                                                min="0.0000001"
                                                step="any"
                                                value={currentPrice}
                                                onChange={(e) => {
                                                    const v = e.target.value;
                                                    if (v === '' || Number(v) >= 0) setCurrentPrice(v);
                                                }}
                                                placeholder="0.00"
                                                className="input-field w-full"
                                            />
                                        </div>
                                    </div>

                                    <div className="mb-7">
                                        <label className="block text-slate-300 text-sm font-semibold mb-3">صورة الشارت</label>
                                        <div className="upload-area" onClick={() => fileInputRef.current?.click()}>
                                            <input
                                                ref={fileInputRef}
                                                type="file"
                                                accept="image/*"
                                                onChange={handleFileSelect}
                                                hidden
                                            />
                                            <div className="flex flex-col items-center gap-4 text-slate-300">
                                                <div className="text-blue-400" style={{ fontSize: '48px' }}>
                                                    <FiUpload />
                                                </div>
                                                <div className="text-center">
                                                    <p className="font-bold text-white">اضغط هنا أو اسحب الصورة</p>
                                                    <p className="text-sm mt-1">PNG • JPG • WEBP • max 5MB</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {preview && (
                                        <div className="mb-8">
                                            <p className="text-slate-300 text-sm font-semibold mb-3">معاينة الصورة</p>
                                            <img
                                                src={preview}
                                                alt="معاينة الشارت"
                                                className="max-h-80 mx-auto rounded-xl border border-slate-700/50 shadow-xl object-contain"
                                            />
                                        </div>
                                    )}

                                    <div className="flex flex-col sm:flex-row gap-4">
                                        <button
                                            onClick={analyzeChart}
                                            disabled={loading || !preview || !assetName || !currentPrice}
                                            className="btn-primary flex-1 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            {loading ? (
                                                <>
                                                    <div className="animate-spin" style={{ fontSize: '20px' }}>
                                                        <FiLoader />
                                                    </div>
                                                    جاري التحليل...
                                                </>
                                            ) : (
                                                <>
                                                    <div style={{ fontSize: '20px' }}>
                                                        <FiZap />
                                                    </div>
                                                    حلل الشارت الآن
                                                </>
                                            )}
                                        </button>

                                        <button onClick={resetForm} className="btn-reset">
                                            إعادة تعيين
                                        </button>
                                    </div>
                                </div>

                                {/* تعليمات سريعة */}
                                <div className="glass p-6 text-slate-300 text-sm">
                                    <h3 className="text-lg font-bold text-white mb-4">كيف تستخدم الأداة؟</h3>
                                    <ol className="space-y-3 list-decimal list-inside pr-4">
                                        <li>أدخل اسم الأصل والسعر الحالي</li>
                                        <li>ارفع صورة شارت واضحة (يفضل يومي أو 4 ساعات)</li>
                                        <li>اضغط "حلل الشارت الآن"</li>
                                        <li>اقرأ التوصية والمستويات بعناية</li>
                                    </ol>
                                    <p className="mt-4 text-amber-400 text-xs">
                                        ملاحظة: التحليل حالياً محاكاة – سيتم ربطه بنموذج رؤية قريباً
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-8">
                                {preview && (
                                    <div className="glass p-6">
                                        <h3 className="text-lg font-bold text-white mb-4">الشارت المحلل</h3>
                                        <img
                                            src={preview}
                                            alt="الشارت الأصلي"
                                            className="max-h-[420px] mx-auto rounded-xl border border-blue-600/30 shadow-2xl object-contain"
                                        />
                                    </div>
                                )}

                                <div className={`decision-box bg-gradient-to-br ${bgColorClass[analysis.color]}`}>
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 mb-10">
                                        <div className="flex-1">
                                            <p className="text-slate-400 uppercase text-xs font-semibold tracking-wider mb-2">القرار الرئيسي</p>
                                            <div className="flex items-center gap-5">
                                                <div style={{ fontSize: '64px' }} className={colorClass[analysis.color]}>
                                                    {analysis.color === 'green' ? <FiTrendingUp /> : analysis.color === 'red' ? <FiTrendingDown /> : <FiAlertCircle />}
                                                </div>
                                                <div>
                                                    <h2 className={`text-4xl md:text-5xl font-black ${colorClass[analysis.color]}`}>
                                                        {analysis.decision}
                                                    </h2>
                                                    <p className="text-slate-300 mt-1">
                                                        الاتجاه: <strong className="text-blue-300">{analysis.trend}</strong>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="text-center">
                                            <p className="text-slate-400 uppercase text-xs font-semibold tracking-wider mb-3">مستوى الثقة</p>
                                            <div className="relative w-28 h-28 mx-auto">
                                                <svg className="absolute inset-0 w-full h-full progress-ring" viewBox="0 0 120 120">
                                                    <circle
                                                        cx="60"
                                                        cy="60"
                                                        r="52"
                                                        fill="none"
                                                        stroke="#334155"
                                                        strokeWidth="12"
                                                    />
                                                    <circle
                                                        cx="60"
                                                        cy="60"
                                                        r="52"
                                                        fill="none"
                                                        stroke={analysis.color === 'green' ? '#10b981' : analysis.color === 'red' ? '#ef4444' : '#f59e0b'}
                                                        strokeWidth="12"
                                                        strokeDasharray="327"
                                                        strokeDashoffset={327 - (327 * analysis.confidence) / 100}
                                                        strokeLinecap="round"
                                                    />
                                                </svg>
                                                <div className="absolute inset-0 flex flex-col items-center justify-center">
                                                    <span className={`text-4xl font-black ${colorClass[analysis.color]}`}>
                                                        {analysis.confidence}%
                                                    </span>
                                                    <span className="text-xs text-slate-400 mt-1">ثقة</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* باقي النتائج */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                        <div className="metric-card">
                                            <p className="text-slate-400 text-sm mb-2">RSI</p>
                                            <p className="text-2xl font-bold text-white">{analysis.rsiValue}</p>
                                            <p className="text-xs text-slate-400">مؤشر القوة النسبية</p>
                                        </div>
                                        <div className="metric-card">
                                            <p className="text-slate-400 text-sm mb-2">MACD</p>
                                            <p className="text-xl font-bold text-white">{analysis.macdTrend}</p>
                                            <p className="text-xs text-slate-400">اتجاه MACD</p>
                                        </div>
                                        <div className="metric-card">
                                            <p className="text-slate-400 text-sm mb-2">السيولة</p>
                                            <p className="text-xl font-bold text-white">{analysis.volumeTrend}</p>
                                            <p className="text-xs text-slate-400">حجم التداول</p>
                                        </div>
                                    </div>

                                    <div className="mb-8">
                                        <h3 className="text-white font-bold mb-3">الأنماط الفنية المكتشفة</h3>
                                        <div className="flex flex-wrap gap-2">
                                            {analysis.chartPatterns.map((pattern, idx) => (
                                                <span key={idx} className="bg-blue-900/50 text-blue-300 px-3 py-1 rounded-full text-sm border border-blue-700/30">
                                                    {pattern}
                                                </span>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                        <div>
                                            <h3 className="text-emerald-400 font-bold mb-3">مستويات الدعم</h3>
                                            <ul className="space-y-2">
                                                {analysis.supportLevels.map((level, idx) => (
                                                    <li key={idx} className="flex justify-between items-center bg-black/20 p-2 rounded-lg">
                                                        <span className="text-slate-400">دعم {idx + 1}</span>
                                                        <span className="text-emerald-400 font-bold">{level}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                        <div>
                                            <h3 className="text-rose-400 font-bold mb-3">مستويات المقاومة</h3>
                                            <ul className="space-y-2">
                                                {analysis.resistanceLevels.map((level, idx) => (
                                                    <li key={idx} className="flex justify-between items-center bg-black/20 p-2 rounded-lg">
                                                        <span className="text-slate-400">مقاومة {idx + 1}</span>
                                                        <span className="text-rose-400 font-bold">{level}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>

                                    <div className="bg-black/30 rounded-xl p-5 mb-8 border border-blue-900/50">
                                        <h3 className="text-white font-bold mb-4 text-lg">📍 نقاط الدخول الموصى بها</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <p className="text-slate-400 text-sm mb-1">سعر الدخول</p>
                                                <p className="text-2xl font-bold text-white">{analysis.recommendedEntryPrice}</p>
                                            </div>
                                            <div>
                                                <p className="text-slate-400 text-sm mb-1">جني الأرباح</p>
                                                <p className="text-2xl font-bold text-emerald-400">{analysis.recommendedTakeProfit}</p>
                                            </div>
                                            <div>
                                                <p className="text-slate-400 text-sm mb-1">وقف الخسارة</p>
                                                <p className="text-2xl font-bold text-rose-400">{analysis.recommendedStopLoss}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-10">
                                        <button
                                            onClick={resetForm}
                                            className="w-full btn-reset text-lg py-4"
                                        >
                                            ✦ تحليل شارت جديد
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // تأكد من وجود root element
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(React.createElement(SmartChartAnalyzer));
        } else {
            console.error('Root element not found');
        }
    </script>
</body>
</html>
