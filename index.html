<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الشارت الذكي – محاكاة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Outfit', system-ui, sans-serif; }
        body { margin:0; background:#0f172a; color:white; }
        .glass {
            background: rgba(15,23,42,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100,200,255,0.2);
            border-radius: 16px;
        }
        .upload-area {
            border: 2px dashed rgba(100,200,255,0.4);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
        }
        .upload-area:hover { background: rgba(30,41,59,0.4); }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: bold;
        }
        .decision-box {
            background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.8));
            border: 2px solid rgba(100,200,255,0.3);
            border-radius: 20px;
            padding: 2rem;
        }
        .disclaimer { color: #fca5a5; font-size: 0.875rem; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>

    <div id="root">جاري تحميل التطبيق...</div>

    <script type="text/babel">
        // ────────────────────────────────────────────────
        // أيقونات بسيطة (بدون Fi* من lucide، نعتمد على svg مباشرة)
        // ────────────────────────────────────────────────
        const IconUpload = () => React.createElement('svg', {width:32,height:32,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},
            React.createElement('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),
            React.createElement('polyline',{points:'17 8 12 3 7 8'}),
            React.createElement('line',{x1:12,y1:3,x2:12,y2:15}));

        const IconZap = () => React.createElement('svg',{width:32,height:32,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},
            React.createElement('polygon',{points:'13 2 3 14 12 14 11 22 21 10 12 10 13 2'}));

        const IconUp = () => React.createElement('svg',{width:48,height:48,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},
            React.createElement('polyline',{points:'23 6 13.5 15.5 8 10 1 18'}));

        const IconDown = () => React.createElement('svg',{width:48,height:48,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},
            React.createElement('polyline',{points:'23 18 13.5 8.5 8 14 1 7'}));

        const IconLoader = () => React.createElement('svg',{width:24,height:24,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,className:'animate-spin'},
            React.createElement('line',{x1:12,y1:2,x2:12,y2:6}),
            React.createElement('line',{x1:12,y1:18,x2:12,y2:22}),
            React.createElement('line',{x1:4.93,y1:4.93,x2:7.76,y2:7.76}),
            React.createElement('line',{x1:16.24,y1:16.24,x2:19.07,y2:19.07}));

        // ────────────────────────────────────────────────
        // المكون الرئيسي
        // ────────────────────────────────────────────────
        
                            // ────────────────────────────────────────────────
// المكون الرئيسي – نسخة سبوت فقط
// ────────────────────────────────────────────────
const SmartChartAnalyzer = () => {
    const [preview, setPreview] = React.useState(null);
    const [analysis, setAnalysis] = React.useState(null);
    const [loading, setLoading] = React.useState(false);
    const [assetName, setAssetName] = React.useState('');
    const [currentPrice, setCurrentPrice] = React.useState('');
    const fileRef = React.useRef(null);

    const handleFile = e => {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith('image/')) return alert('اختر صورة فقط');
        if (file.size > 5*1024*1024) return alert('الحد الأقصى 5 ميجا');

        const reader = new FileReader();
        reader.onload = ev => setPreview(ev.target.result);
        reader.readAsDataURL(file);
    };

    const analyze = async () => {
        if (!preview || !assetName || !currentPrice) return alert('املأ جميع الحقول');
        setLoading(true);

        await new Promise(r => setTimeout(r, 1600));

        const price = parseFloat(currentPrice) || 100;
        // درجة إيجابية فقط (للسبوت)
        const bullishScore = Math.floor(Math.random() * 16); // 0 → 15

        let decision, color, message, showTradePlan = false;

        if (bullishScore >= 11) {
            decision = 'شراء قوي';
            color = 'green';
            message = 'إشارة صعود قوية – مناسب للدخول في سبوت';
            showTradePlan = true;
        } else if (bullishScore >= 6) {
            decision = 'شراء';
            color = 'emerald';
            message = 'إشارة صعود معتدلة – يمكن الدخول بحذر';
            showTradePlan = true;
        } else if (bullishScore >= 3) {
            decision = 'محايد إيجابي';
            color = 'blue';
            message = 'الوضع إيجابي لكن ليس قوي بما يكفي بعد';
        } else {
            decision = 'انتظر';
            color = 'yellow';
            message = 'الوضع غير مناسب للدخول في سبوت حاليًا';
        }

        const confidence = Math.floor(50 + bullishScore * 3); // 50–95%

        const entry  = showTradePlan ? (price * 0.975).toFixed(2) : null;
        const tp    = showTradePlan ? (price * 1.10).toFixed(2) : null;
        const sl    = showTradePlan ? (price * 0.94).toFixed(2) : null;

        setAnalysis({
            decision,
            color,
            message,
            confidence,
            entry, tp, sl,
            showTradePlan
        });
        setLoading(false);
    };

    const reset = () => {
        setPreview(null); setAnalysis(null);
        setAssetName(''); setCurrentPrice('');
        if (fileRef.current) fileRef.current.value = '';
    };

    const colors = {
        green:   {text:'text-emerald-400', bg:'from-emerald-950 to-emerald-800'},
        emerald: {text:'text-emerald-300', bg:'from-emerald-950 to-emerald-800'},
        blue:    {text:'text-blue-300',    bg:'from-blue-950 to-blue-800'},
        yellow:  {text:'text-amber-400',   bg:'from-amber-950 to-amber-800'},
    };

    const c = analysis ? colors[analysis.color] || colors.yellow : colors.yellow;

    return React.createElement('div', {className:'min-h-screen p-6 bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900'},
        React.createElement('div', {className:'max-w-4xl mx-auto text-center'},
            React.createElement('h1', {className:'text-4xl md:text-5xl font-extrabold mb-3 bg-gradient-to-r from-cyan-300 to-blue-500 bg-clip-text text-transparent'},
                'محلل الشارت – سبوت فقط'
            ),
            React.createElement('p', {className:'text-slate-400 mb-10'}, 'محاكاة تعليمية – ليس توصية مالية'),

            !analysis ?
            // نموذج الإدخال
            React.createElement('div', {className:'glass p-8 rounded-2xl'},
                React.createElement('div', {className:'grid md:grid-cols-2 gap-6 mb-8'},
                    React.createElement('div', null,
                        React.createElement('label', {className:'block text-sm mb-2 text-slate-300'}, 'اسم الأصل / الرمز'),
                        React.createElement('input', {
                            type:'text', value:assetName, onChange:e=>setAssetName(e.target.value),
                            placeholder:'BTCUSDT – ETHUSDT – 7203.SR', 
                            className:'w-full p-3.5 bg-slate-800 border border-slate-600 rounded-xl text-white'
                        })
                    ),
                    React.createElement('div', null,
                        React.createElement('label', {className:'block text-sm mb-2 text-slate-300'}, 'السعر الحالي'),
                        React.createElement('input', {
                            type:'number', value:currentPrice, onChange:e=>setCurrentPrice(e.target.value),
                            placeholder:'0.00', 
                            className:'w-full p-3.5 bg-slate-800 border border-slate-600 rounded-xl text-white'
                        })
                    )
                ),

                React.createElement('div', {className:'mb-8'},
                    React.createElement('label', {className:'block text-sm mb-2 text-slate-300'}, 'صورة الشارت'),
                    React.createElement('div', {className:'upload-area border-2 border-dashed border-blue-600/40 rounded-2xl p-10', onClick:()=>fileRef.current.click()},
                        React.createElement('input', {ref:fileRef, type:'file', accept:'image/*', onChange:handleFile, hidden:true}),
                        React.createElement('div', {className:'text-7xl text-blue-500 mb-4'}, '↑'),
                        React.createElement('p', {className:'text-lg'}, 'اضغط أو اسحب الصورة هنا')
                    )
                ),

                preview && React.createElement('img', {src:preview, className:'max-h-72 mx-auto rounded-xl border border-slate-700 mb-8', alt:'preview'}),

                React.createElement('div', {className:'flex flex-col sm:flex-row gap-4 justify-center'},
                    React.createElement('button', {
                        onClick:analyze, disabled:loading || !preview || !assetName || !currentPrice,
                        className:'bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 text-white font-bold py-4 px-10 rounded-xl disabled:opacity-50 flex items-center justify-center gap-3 text-lg'
                    },
                        loading ? 'جاري التحليل...' : 'حلل الشارت الآن'
                    ),
                    React.createElement('button', {onClick:reset, className:'bg-slate-700 hover:bg-slate-600 text-white font-medium py-4 px-8 rounded-xl'}, 'مسح')
                )
            )
            :
            // نتيجة التحليل – سبوت فقط
            React.createElement('div', {className:'space-y-8'},
                preview && React.createElement('img', {src:preview, className:'max-h-[500px] mx-auto rounded-2xl border border-slate-700 shadow-2xl', alt:'chart'}),

                React.createElement('div', {className:`glass p-10 rounded-3xl bg-gradient-to-br \( {c.bg} border-t-4 border- \){analysis.color}-600 text-center`},
                    React.createElement('h2', {className:`text-5xl md:text-6xl font-black mb-6 ${c.text}`}, analysis.decision),
                    React.createElement('p', {className:'text-2xl mb-8 font-medium'}, analysis.message),
                    React.createElement('p', {className:'text-3xl mb-10'}, 
                        'مستوى الثقة: ', 
                        React.createElement('span', {className:`font-bold ${c.text}`}, analysis.confidence, '%')
                    ),

                    analysis.showTradePlan && React.createElement('div', {className:'grid md:grid-cols-3 gap-6 mb-10'},
                        React.createElement('div', {className:'bg-black/40 p-6 rounded-2xl'},
                            React.createElement('p', {className:'text-slate-400 mb-2'}, 'سعر الدخول المقترح'),
                            React.createElement('p', {className:'text-3xl font-bold text-cyan-300'}, analysis.entry)
                        ),
                        React.createElement('div', {className:'bg-black/40 p-6 rounded-2xl'},
                            React.createElement('p', {className:'text-slate-400 mb-2'}, 'هدف جني الأرباح'),
                            React.createElement('p', {className:'text-3xl font-bold text-emerald-400'}, analysis.tp)
                        ),
                        React.createElement('div', {className:'bg-black/40 p-6 rounded-2xl'},
                            React.createElement('p', {className:'text-slate-400 mb-2'}, 'وقف الخسارة'),
                            React.createElement('p', {className:'text-3xl font-bold text-rose-400'}, analysis.sl)
                        )
                    ),

                    React.createElement('p', {className:'text-amber-300 text-sm mb-8'}, 
                        'هذه محاكاة عشوائية تعليمية فقط – لا تستخدمها كأساس لقرارات مالية حقيقية'
                    ),

                    React.createElement('button', {
                        onClick:reset,
                        className:'bg-gradient-to-r from-indigo-600 to-purple-700 hover:from-indigo-500 hover:to-purple-600 text-white font-bold py-5 px-12 rounded-xl text-lg'
                    }, 'تحليل شارت جديد')
                )
            )
        )
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SmartChartAnalyzer));
    </script>
</body>
</html>
